<ion-header>
  <ion-toolbar>
    <ion-title>Registro de Usuario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Crear una cuenta</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form (submit)="register()">
        <ion-item>
          <ion-label position="floating">Nombre </ion-label>
          <ion-input [(ngModel)]="nombre" type="text" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Correo Electrónico</ion-label>
          <ion-input [(ngModel)]="email" type="email" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input [(ngModel)]="password" type="password" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit">Registrarse</ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
